<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#166534" />
    <title>Online Store</title>
    <script>
      // Only the Sabito marketplace domain carries Sabito branding; Online Stores
      // (store.absghana.com and merchant domains) get their store name once it loads.
      if (/(^|\.)sabitostore\.com$/.test(window.location.hostname)) document.title = 'Sabito Store';
    </script>
  </head>
